name: Django CI/CD Pipeline

# 1. КОГДА ЗАПУСКАТЬ (Триггеры)
on:
  push:
    branches: [ main, master, video ] # Запускать при пуше в эти ветки

jobs:
  # ==========================================
  # JOB 1: CI (Continuous Integration - Тесты)
  # ==========================================
  test:
    runs-on: ubuntu-20.04 # Используем ту же ОС, что и на сервере Reg.ru
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Скачиваем код из репозитория

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8' # Версия Python как на сервере

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      env:
        # Передаем фейковый ключ, чтобы Django не ругался при старте
        SECRET_KEY: 'test-secret-key-for-github-actions'
        DEBUG: 'True'
      run: |
        # ХИТРОСТЬ: Подменяем PostgreSQL на SQLite ТОЛЬКО для тестов в GitHub.
        # Это позволяет запускать тесты без реальной базы данных.
        sed -i "s/'ENGINE': 'django.db.backends.postgresql'/'ENGINE': 'django.db.backends.sqlite3'/" website/settings.py
        sed -i "s/'NAME': os.getenv('DB_NAME')/'NAME': os.path.join(BASE_DIR, 'db.sqlite3')/" website/settings.py
        
        # Запускаем тесты
        python manage.py test

  # ==========================================
  # JOB 2: CD (Continuous Deployment - Деплой)
  # ==========================================
  deploy:
    needs: test # Деплой начнется ТОЛЬКО если тесты (job test) прошли успешно
    runs-on: ubuntu-20.04
    steps:
    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@master
      with:
        # Берем данные из GitHub Secrets (Settings -> Secrets and variables -> Actions)
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # 1. Переходим в папку проекта на сервере
          cd /root/dj-homeworks/2.2-databases-2/orm_migrations
          
          # 2. Скачиваем новый код из ветки video
          git pull origin video
          
          # 3. Активируем виртуальное окружение
          source venv/bin/activate
          
          # 4. Обновляем зависимости (на случай, если вы добавили новые библиотеки)
          pip install -r requirements.txt
          
          # 5. Применяем миграции (если меняли модели)
          python manage.py migrate
          
          # 6. Собираем статику (картинки, CSS)
          python manage.py collectstatic --noinput
          
          # 7. Копируем статику в папку для Nginx (которую мы настроили вручную)
          cp -r staticfiles/* /var/www/static/
          
          # 8. Перезапускаем Gunicorn, чтобы он подхватил новый код
          sudo systemctl restart gunicorn